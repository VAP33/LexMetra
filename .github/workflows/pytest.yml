name: backend-pytest

# DEVOPS-01 CI gate. Blocks merge when the TEST-BASELINE floor regresses:
# 480 passed / 4 skipped / 0 failed on a clean DB as of ca3d221. New tests may
# raise the floor; they must not introduce failures.

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lmpc_app
          POSTGRES_PASSWORD: lmpc_dev_pw
          POSTGRES_DB: lmpc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lmpc_app -d lmpc_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://lmpc_app:lmpc_dev_pw@localhost:5432/lmpc_test
      LMPC_BOOTSTRAP_DEMO_USERS: "false"
      LMPC_DEMO_MODE: "false"
      LMPC_DEV_MODE: "true"
      LMPC_TEST_RESET_DB: "true"
      LMPC_ENABLE_PADDLEOCR: "false"
      LMPC_ENABLE_OPENL: "false"
      LMPC_ENABLE_CONSUMER_SCAN: "false"
      LMPC_ENABLE_FSSAI: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System deps (Tesseract, poppler)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr tesseract-ocr-eng poppler-utils libzbar0 libgl1
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
      - name: Pytest (clean-DB baseline)
        run: |
          python -m pytest backend/tests -q --tb=short
        working-directory: ${{ github.workspace }}
