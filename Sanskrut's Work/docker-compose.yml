# Local/demo deployment: backend API + PostgreSQL.
#
# Quick start:
#   cp backend/.env.example .env
#   # edit .env: set a real JWT_SECRET_KEY, review DATABASE_URL/POSTGRES_* to match
#   docker compose up --build
#
# The API will be reachable at http://localhost:8000 (see /health).
# The very first account created via POST /auth/register becomes admin
# (see README.md / SETUP.md).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lmpc_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lmpc_dev_pw}
      POSTGRES_DB: ${POSTGRES_DB:-lmpc}
    volumes:
      - lmpc_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lmpc_app} -d ${POSTGRES_DB:-lmpc}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      # Exposed for local debugging only; remove in a real deployment.
      - "5432:5432"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-lmpc_app}:${POSTGRES_PASSWORD:-lmpc_dev_pw}@db:5432/${POSTGRES_DB:-lmpc}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in your .env file — see backend/.env.example}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-480}
      LMPC_DEV_MODE: ${LMPC_DEV_MODE:-false}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}
      UPLOAD_DIR: /app/backend/uploads
      REPORT_DIR: /app/backend/reports
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      VLM_VERIFICATION_ENABLED: ${VLM_VERIFICATION_ENABLED:-false}
    volumes:
      - lmpc_uploads:/app/backend/uploads
      - lmpc_reports:/app/backend/reports
    ports:
      - "8000:8000"

volumes:
  lmpc_pgdata:
  lmpc_uploads:
  lmpc_reports:
