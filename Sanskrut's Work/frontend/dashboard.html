<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LMPC Legal Metrology Compliance Inspection Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #090d16;
    --primary-surface: #131c2e;
    --accent: #2563eb;
    --accent-teal: #00e0a8;
    --accent-hover: #1d4ed8;
    --pass: #059669;
    --pass-bg: #ecfdf5;
    --pass-border: #a7f3d0;
    --fail: #dc2626;
    --fail-bg: #fef2f2;
    --fail-border: #fecaca;
    --uncertain: #d97706;
    --uncertain-bg: #fffbeb;
    --uncertain-border: #fde68a;
    --exempt: #475569;
    --exempt-bg: #f1f5f9;
    --exempt-border: #cbd5e1;
    --bg: #f8fafc;
    --card: #ffffff;
    --border: #e2e8f0;
    --text: #0f172a;
    --text-muted: #64748b;
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 18px;
    --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
    --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.07), 0 2px 4px -2px rgb(0 0 0 / 0.07);
    --shadow-lg: 0 10px 20px -3px rgb(0 0 0 / 0.08), 0 4px 6px -4px rgb(0 0 0 / 0.04);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  /* Header */
  header {
    background: var(--primary);
    color: #fff;
    padding: 14px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: var(--shadow-md);
    position: sticky;
    top: 0;
    z-index: 50;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .brand-logo {
    width: 38px;
    height: 38px;
    background: linear-gradient(135deg, #00e0a8, #2563eb);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 18px;
    color: #000;
    box-shadow: 0 2px 10px rgba(0, 224, 168, 0.4);
  }
  .brand-text h1 {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .brand-text p {
    font-size: 11px;
    color: #94a3b8;
    font-weight: 500;
  }

  nav {
    display: flex;
    gap: 6px;
    background: rgba(255, 255, 255, 0.08);
    padding: 4px;
    border-radius: var(--radius-md);
  }
  nav button {
    background: transparent;
    border: none;
    color: #cbd5e1;
    padding: 8px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  nav button:hover {
    color: #fff;
    background: rgba(255, 255, 255, 0.06);
  }
  nav button.active {
    background: #fff;
    color: var(--primary);
    box-shadow: var(--shadow-sm);
  }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .user-badge {
    font-size: 12px;
    background: rgba(0, 224, 168, 0.15);
    border: 1px solid rgba(0, 224, 168, 0.3);
    padding: 5px 12px;
    border-radius: 20px;
    color: #00e0a8;
    font-weight: 600;
    font-family: 'JetBrains Mono', monospace;
  }

  /* Main Container */
  main {
    max-width: 1320px;
    margin: 24px auto;
    padding: 0 20px 80px;
  }

  /* Scoreboard KPIs */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
    margin-bottom: 24px;
  }
  .kpi-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 16px 20px;
    box-shadow: var(--shadow-sm);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .kpi-info h4 {
    font-size: 12px;
    color: var(--text-muted);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .kpi-info .kpi-val {
    font-size: 24px;
    font-weight: 800;
    margin-top: 2px;
  }
  .kpi-icon {
    font-size: 28px;
    padding: 10px;
    border-radius: 12px;
    background: #f1f5f9;
  }

  /* Cards & Layout */
  .grid-2 {
    display: grid;
    grid-template-columns: 440px 1fr;
    gap: 24px;
  }
  @media (max-width: 1040px) {
    .grid-2 { grid-template-columns: 1fr; }
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 24px;
    box-shadow: var(--shadow-sm);
    margin-bottom: 20px;
  }
  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }
  .card-header h2 {
    font-size: 16px;
    font-weight: 700;
    color: var(--text);
  }

  /* Form Elements */
  label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: #475569;
    margin-bottom: 6px;
    margin-top: 14px;
  }
  label:first-of-type { margin-top: 0; }
  input, select {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 13px;
    font-family: inherit;
    color: var(--text);
    background: #fff;
    transition: all 0.15s;
  }
  input:focus, select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(37,99,235,0.12);
  }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }

  /* Upload Area */
  .upload-box {
    border: 2px dashed #cbd5e1;
    border-radius: var(--radius-md);
    padding: 28px 16px;
    text-align: center;
    background: #f8fafc;
    cursor: pointer;
    transition: all 0.2s ease;
    margin-bottom: 14px;
  }
  .upload-box:hover, .upload-box.dragover {
    border-color: var(--accent);
    background: #eff6ff;
  }
  .upload-icon {
    font-size: 36px;
    margin-bottom: 8px;
  }
  .upload-box p {
    font-size: 13px;
    color: var(--text-muted);
  }
  .upload-box p b {
    color: var(--accent);
  }

  .preset-pills {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }
  .pill-btn {
    background: #f1f5f9;
    border: 1px solid var(--border);
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .pill-btn:hover {
    background: #e2e8f0;
    border-color: #cbd5e1;
  }

  /* File Thumbnails Tray */
  .files-tray {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(75px, 1fr));
    gap: 8px;
    margin: 12px 0 16px;
    max-height: 180px;
    overflow-y: auto;
    padding: 8px;
    background: #f8fafc;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
  }
  .file-chip {
    position: relative;
    border-radius: 6px;
    overflow: hidden;
    background: #e2e8f0;
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    font-weight: 600;
    border: 1px solid var(--border);
  }
  .file-chip img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .file-chip .chip-name {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    background: rgba(0,0,0,0.7);
    color: #fff;
    font-size: 8px;
    padding: 2px 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* Buttons */
  button.primary {
    width: 100%;
    margin-top: 14px;
    background: linear-gradient(135deg, #00e0a8, #2563eb);
    color: #000;
    border: none;
    padding: 13px 20px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-size: 14px;
    font-weight: 800;
    transition: all 0.15s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    box-shadow: 0 4px 12px rgba(0, 224, 168, 0.25);
  }
  button.primary:hover:not(:disabled) {
    transform: translateY(-1px);
    box-shadow: 0 6px 16px rgba(0, 224, 168, 0.4);
  }
  button.primary:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
  }
  button.secondary {
    background: #fff;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 14px;
    border-radius: var(--radius-sm);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  button.secondary:hover {
    background: #f1f5f9;
    border-color: #cbd5e1;
  }

  /* Badges & Status */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .badge.PASS, .badge.COMPLIANT {
    background: var(--pass-bg);
    color: var(--pass);
    border: 1px solid var(--pass-border);
  }
  .badge.FAIL, .badge.VIOLATION {
    background: var(--fail-bg);
    color: var(--fail);
    border: 1px solid var(--fail-border);
  }
  .badge.UNCERTAIN, .badge.REVIEW_REQUIRED {
    background: var(--uncertain-bg);
    color: var(--uncertain);
    border: 1px solid var(--uncertain-border);
  }
  .badge.EXEMPT, .badge.INFO {
    background: var(--exempt-bg);
    color: var(--exempt);
    border: 1px solid var(--exempt-border);
  }

  /* Batch Card Results Grid */
  .batch-cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
    margin-top: 16px;
  }
  .inspection-item-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    overflow: hidden;
    box-shadow: var(--shadow-sm);
    transition: all 0.2s ease;
    cursor: pointer;
    display: flex;
    flex-direction: column;
  }
  .inspection-item-card:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
    border-color: #93c5fd;
  }
  .item-card-preview {
    height: 170px;
    background: #0f172a;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .item-card-preview img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }
  .item-card-badge {
    position: absolute;
    top: 10px;
    right: 10px;
  }
  .item-card-body {
    padding: 14px 16px;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .item-card-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 6px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .item-card-tags {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
    margin-bottom: 8px;
  }
  .field-tag {
    font-size: 10px;
    background: #f1f5f9;
    padding: 2px 6px;
    border-radius: 4px;
    color: #475569;
    font-weight: 600;
  }
  .field-tag.active {
    background: #ecfdf5;
    color: #065f46;
    border: 1px solid #a7f3d0;
  }
  .item-card-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
    color: var(--text-muted);
    border-top: 1px solid #f1f5f9;
    padding-top: 10px;
    margin-top: 10px;
  }

  /* Visual Modal / Detail Viewer */
  .modal-backdrop {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(15, 23, 42, 0.85);
    backdrop-filter: blur(6px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
  }
  .modal-window {
    background: #fff;
    border-radius: var(--radius-lg);
    width: 100%;
    max-width: 1100px;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
    display: flex;
    flex-direction: column;
  }
  .modal-header {
    padding: 18px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #f8fafc;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .modal-body {
    padding: 24px;
  }

  /* Table styling */
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    margin-top: 10px;
  }
  th, td {
    padding: 10px 12px;
    text-align: left;
    border-bottom: 1px solid var(--border);
  }
  th {
    color: var(--text-muted);
    font-weight: 700;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    background: #f8fafc;
  }
  tr.clickable {
    cursor: pointer;
    transition: background 0.15s;
  }
  tr.clickable:hover {
    background: #f8fafc;
  }
  .rule-tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    background: #f1f5f9;
    padding: 2px 6px;
    border-radius: 4px;
    color: #334155;
    font-weight: 600;
  }

  /* Progress bar */
  .progress-container {
    background: #f1f5f9;
    border-radius: 10px;
    height: 8px;
    overflow: hidden;
    margin: 12px 0 6px;
    border: 1px solid var(--border);
  }
  .progress-bar {
    height: 100%;
    background: linear-gradient(90deg, #00e0a8, #2563eb);
    width: 0%;
    transition: width 0.3s ease;
  }

  /* Spinner */
  .spinner {
    display: inline-block;
    width: 16px;
    height: 16px;
    border: 2px solid rgba(0,0,0,0.2);
    border-radius: 50%;
    border-top-color: #000;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .flag-banner {
    background: #fffbeb;
    border: 1px solid #fde68a;
    border-radius: var(--radius-sm);
    padding: 12px 16px;
    font-size: 13px;
    color: #92400e;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .coverage-meter {
    background: #e2e8f0;
    height: 10px;
    border-radius: 6px;
    overflow: hidden;
    margin: 8px 0;
  }
  .coverage-fill {
    height: 100%;
    background: #059669;
    transition: width 0.4s ease;
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-logo">LM</div>
    <div class="brand-text">
      <h1>Legal Metrology Inspection Platform</h1>
      <p>Packaged Commodities Rules, 2011 — SIH 2026 (PS 26034)</p>
    </div>
  </div>
  <nav>
    <button data-view="batch_scan" class="active">⚡ Multi-Image AI Scanner</button>
    <button data-view="single_scan">🔍 Single Scan</button>
    <button data-view="inspections">📋 Inspections</button>
    <button data-view="review">⚖️ Review Queue</button>
    <button onclick="window.location.href='/capture.html'">📐 Calibrated Tool</button>
  </nav>
  <div class="header-actions">
    <span class="user-badge" id="engineStatusBadge">⚡ Ultra-Fast ONNX OCR Active</span>
  </div>
</header>

<main>
  <!-- KPI Scorecard -->
  <div class="kpi-grid" id="kpiScorecard">
    <div class="kpi-card">
      <div class="kpi-info">
        <h4>Total Scans</h4>
        <div class="kpi-val" id="kpiTotal">0</div>
      </div>
      <div class="kpi-icon">📦</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-info">
        <h4>Compliant (PASS)</h4>
        <div class="kpi-val" style="color:var(--pass);" id="kpiPass">0</div>
      </div>
      <div class="kpi-icon">✓</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-info">
        <h4>Violations Detected</h4>
        <div class="kpi-val" style="color:var(--fail);" id="kpiFail">0</div>
      </div>
      <div class="kpi-icon">✕</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-info">
        <h4>Avg Scan Latency</h4>
        <div class="kpi-val" style="color:var(--accent);" id="kpiLatency">~0.4s</div>
      </div>
      <div class="kpi-icon">⚡</div>
    </div>
  </div>

  <div id="viewContainer"></div>
</main>

<!-- Detail View Modal -->
<div class="modal-backdrop" id="detailModal" onclick="if(event.target===this)closeModal()">
  <div class="modal-window">
    <div class="modal-header">
      <div>
        <h3 style="font-size:16px; font-weight:700;" id="modalTitle">Package Inspection Findings</h3>
        <p style="font-size:11px; color:var(--text-muted);" id="modalSubtitle">Legal Metrology Compliance Report</p>
      </div>
      <button class="secondary" onclick="closeModal()">✕ Close</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script>
// Dynamic API origin resolution
const API = window.location.origin.includes('http') ? window.location.origin : 'http://localhost:8000';
let currentView = "batch_scan";
let selectedBatchFiles = [];
let lastBatchResult = null;
let activeModalResult = null;
let showingModalOverlay = true;

document.querySelectorAll("nav button[data-view]").forEach(btn => {
  btn.onclick = () => setView(btn.dataset.view);
});

function setView(v) {
  currentView = v;
  document.querySelectorAll("nav button[data-view]").forEach(b => b.classList.toggle("active", b.dataset.view === v));
  if (v === "batch_scan") renderBatchScanView();
  else if (v === "single_scan") renderSingleScanView();
  else if (v === "inspections") renderInspections(false);
  else if (v === "review") renderInspections(true);
}

function badge(status) {
  const s = String(status || 'UNCERTAIN').toUpperCase();
  const cls = (s === 'PASS' || s === 'COMPLIANT') ? 'PASS' : ((s === 'FAIL' || s === 'VIOLATION') ? 'FAIL' : 'UNCERTAIN');
  return `<span class="badge ${cls}">${s}</span>`;
}

// ---------------- 1. MULTI-IMAGE BATCH SCANNER VIEW ----------------
function renderBatchScanView() {
  document.getElementById("viewContainer").innerHTML = `
    <div class="grid-2">
      <!-- Left Controls Panel -->
      <div class="card">
        <div class="card-header">
          <h2>1. Multi-Image Upload & Options</h2>
          <span class="badge PASS">⚡ Sub-Second Engine</span>
        </div>

        <div class="preset-pills">
          <button class="pill-btn" onclick="loadSamplePreset('3_surface')">📦 Load 3-Surface Sample</button>
          <button class="pill-btn" onclick="loadSamplePreset('5_products')">🚀 Load 5-Product Batch</button>
          <button class="pill-btn" onclick="clearSelectedFiles()">🗑️ Clear</button>
        </div>

        <div class="upload-box" id="batchDropZone" onclick="document.getElementById('batchFileInput').click()">
          <div class="upload-icon">📸</div>
          <p><b>Click to select multiple images</b> or drag & drop</p>
          <p style="font-size:11px; margin-top:4px;">Upload multiple sides of 1 package OR batch of different products (PNG, JPG, WEBP)</p>
          <input type="file" id="batchFileInput" multiple accept="image/*" style="display:none">
        </div>

        <div id="filesCountNote" style="font-size:12px; font-weight:600; color:var(--accent); margin-bottom:8px; display:none;"></div>
        <div class="files-tray" id="filesTray" style="display:none;"></div>

        <div class="row2">
          <div>
            <label>Inspection Mode</label>
            <select id="batchScanMode">
              <option value="multi_surface" selected>📦 Single Product (Multi-Surface Package Fusion)</option>
              <option value="batch_products">🚀 Batch Products (Multiple Separate Items)</option>
            </select>
          </div>
          <div>
            <label>Product Category</label>
            <select id="batchProdCategory">
              <option value="food">Food / Beverage</option>
              <option value="personal_care">Personal Care</option>
              <option value="cosmetic">Cosmetics</option>
              <option value="household">Household / Cleaning</option>
              <option value="general">General Packaged Goods</option>
            </select>
          </div>
        </div>

            <span id="progressTimer">0.0s</span>
          </div>
          <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
          </div>
        </div>

        <button class="primary" id="executeBatchBtn">
          <span>⚡ Execute Instant Multi-Image AI Scan</span>
        </button>

        <div style="font-size:11px; color:var(--text-muted); margin-top:14px; border-top:1px solid var(--border); padding-top:10px;">
          <b>LMPC Rule Verification:</b> When multiple surfaces of 1 product are uploaded, all declarations (MRP, Net Qty, Mfg Date, Unit Price, Mfg, Care) are automatically compiled and fused across all surfaces into 1 official statutory report.
        </div>
      </div>

      <!-- Right Results Panel -->
      <div id="batchResultsCard">
        <div class="card" style="text-align:center; padding:60px 20px; color:var(--text-muted);">
          <div style="font-size:48px; margin-bottom:12px;">📊</div>
          <h3 style="font-size:16px; font-weight:700; color:var(--text); margin-bottom:6px;">Awaiting Packaging Images</h3>
          <p style="font-size:13px; max-width:420px; margin:0 auto;">
            Select 2 or 3 photos of a single product (Front, Back, Side) or click <b>"Load 3-Surface Sample"</b> to compile a unified compliance inspection report with PDF export.
          </p>
        </div>
      </div>
    </div>
  `;

  const input = document.getElementById("batchFileInput");
  const dropZone = document.getElementById("batchDropZone");

  input.onchange = () => handleSelectedFiles(Array.from(input.files));

  dropZone.ondragover = (e) => { e.preventDefault(); dropZone.classList.add("dragover"); };
  dropZone.ondragleave = () => { dropZone.classList.remove("dragover"); };
  dropZone.ondrop = (e) => {
    e.preventDefault();
    dropZone.classList.remove("dragover");
    if (e.dataTransfer.files.length) {
      handleSelectedFiles(Array.from(e.dataTransfer.files));
    }
  };

  document.getElementById("executeBatchBtn").onclick = runBatchInspection;
}

function handleSelectedFiles(files) {
  if (!files || !files.length) return;
  selectedBatchFiles = files;
  const countNote = document.getElementById("filesCountNote");
  const tray = document.getElementById("filesTray");

  countNote.style.display = "block";
  countNote.textContent = `✓ Selected ${files.length} package image(s) for scan`;

  tray.style.display = "grid";
  tray.innerHTML = "";

  files.forEach((f, idx) => {
    const chip = document.createElement("div");
    chip.className = "file-chip";
    const img = document.createElement("img");
    img.src = URL.createObjectURL(f);
    const label = document.createElement("div");
    label.className = "chip-name";
    label.textContent = f.name;
    chip.appendChild(img);
    chip.appendChild(label);
    tray.appendChild(chip);
  });
}

function clearSelectedFiles() {
  selectedBatchFiles = [];
  const countNote = document.getElementById("filesCountNote");
  const tray = document.getElementById("filesTray");
  if (countNote) countNote.style.display = "none";
  if (tray) { tray.style.display = "none"; tray.innerHTML = ""; }
}

async function loadSamplePreset(presetType) {
  const btn = document.getElementById("executeBatchBtn");
  btn.disabled = true;
  btn.textContent = "⏳ Loading Dataset Samples…";

  try {
    let urls = [];
    if (presetType === "3_surface") {
      document.getElementById("batchScanMode").value = "multi_surface";
      urls = [
        "../dataset/images/prod001_compliant.png",
        "../dataset/images/prod002_compliant.png",
        "../dataset/images/prod003_compliant.png"
      ];
    } else {
      document.getElementById("batchScanMode").value = "batch_products";
      urls = [
        "../dataset/images/prod001_compliant.png",
        "../dataset/images/prod001_violation_missing_mfg_date.png",
        "../dataset/images/prod002_violation_tiny_mrp_font.png",
        "../dataset/images/prod003_compliant.png",
        "../dataset/images/prod004_violation_missing_consumer_care.png"
      ];
    }

    const fetchedFiles = [];
    for (const u of urls) {
      try {
        const res = await fetch(u);
        if (res.ok) {
          const blob = await res.blob();
          const filename = u.split('/').pop();
          fetchedFiles.push(new File([blob], filename, { type: blob.type || 'image/png' }));
        }
      } catch (err) {}
    }

    if (fetchedFiles.length > 0) {
      handleSelectedFiles(fetchedFiles);
    } else {
      alert("Could not load dataset files directly. Please use the file upload.");
    }
  } catch (e) {
    alert("Preset load error: " + e.message);
  } finally {
    btn.disabled = false;
    btn.innerHTML = "<span>⚡ Execute Instant Multi-Image AI Scan</span>";
  }
}

async function runBatchInspection() {
  if (!selectedBatchFiles.length) {
    alert("Please upload or load at least one package image.");
    return;
  }

  const btn = document.getElementById("executeBatchBtn");
  const progSec = document.getElementById("progressSection");
  const progBar = document.getElementById("progressBar");
  const progLabel = document.getElementById("progressLabel");
  const progTimer = document.getElementById("progressTimer");

  btn.disabled = true;
  btn.innerHTML = `<span class="spinner"></span> <span>Scanning ${selectedBatchFiles.length} Images…</span>`;
  progSec.style.display = "block";
  progBar.style.width = "20%";

  const startTime = performance.now();
  const timerInt = setInterval(() => {
    const elapsed = ((performance.now() - startTime) / 1000).toFixed(1);
    progTimer.textContent = `${elapsed}s`;
    const curW = parseInt(progBar.style.width) || 20;
    if (curW < 85) progBar.style.width = `${curW + 15}%`;
  }, 200);

  const mode = document.getElementById("batchScanMode").value;
  const category = document.getElementById("batchProdCategory").value;

  const fd = new FormData();
  selectedBatchFiles.forEach(f => fd.append("files", f));
  fd.append("product_category", category);
  fd.append("mode", mode);

  try {
    const res = await fetch(`${API}/cv/batch-scan`, { method: "POST", body: fd });
    clearInterval(timerInt);
    progBar.style.width = "100%";
    const totalElapsedSec = ((performance.now() - startTime) / 1000).toFixed(2);
    progTimer.textContent = `${totalElapsedSec}s`;
    progLabel.textContent = "Inspection Finished!";

    btn.disabled = false;
    btn.innerHTML = "<span>⚡ Execute Instant Multi-Image AI Scan</span>";

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      document.getElementById("batchResultsCard").innerHTML = `
        <div class="card"><div class="flag-banner">⚠️ Scan Error: ${err.detail || JSON.stringify(err)}</div></div>
      `;
      return;
    }

    const data = await res.json();
    lastBatchResult = data;
    updateKpis(data);

    if (mode === "multi_surface") {
      renderMultiSurfaceResult(data);
    } else {
      renderBatchProductsResult(data);
    }
  } catch (err) {
    clearInterval(timerInt);
    btn.disabled = false;
    btn.innerHTML = "<span>⚡ Execute Instant Multi-Image AI Scan</span>";
    document.getElementById("batchResultsCard").innerHTML = `
      <div class="card"><div class="flag-banner">⚠️ Network/Server Error: ${err.message}</div></div>
    `;
  }
}

function updateKpis(data) {
  if (data.mode === "batch_products" && data.summary) {
    const s = data.summary;
    document.getElementById("kpiTotal").textContent = data.total_scanned || 0;
    document.getElementById("kpiPass").textContent = s.compliant_count || 0;
    document.getElementById("kpiFail").textContent = s.violation_count || 0;
    document.getElementById("kpiLatency").textContent = `${s.avg_time_per_image_ms || 350}ms`;
  } else if (data.mode === "multi_surface_fusion") {
    document.getElementById("kpiTotal").textContent = data.total_surfaces || 1;
    document.getElementById("kpiPass").textContent = data.is_compliant ? "1" : "0";
    document.getElementById("kpiFail").textContent = !data.is_compliant ? "1" : "0";
    document.getElementById("kpiLatency").textContent = `${data.total_processing_time_ms || 400}ms`;
  }
}

function renderBatchProductsResult(data) {
  const results = data.results || [];
  const s = data.summary || {};

  const cardsHtml = results.map((r, idx) => {
    const isPass = r.compliance_verdict === "COMPLIANT";

    const vBadge = isPass ? "PASS" : (isUncertain ? "UNCERTAIN" : "FAIL");
    const decls = r.declarations || {};

    const tags = [
      decls.mrp ? `<span class="field-tag active">MRP: ${decls.mrp}</span>` : `<span class="field-tag">No MRP</span>`,

async function downloadPdfReport(reportData, btnElement) {
  if (!reportData) {
    alert("No inspection report data available to export.");
    return;
  }

  const btn = btnElement || event?.target;
  let originalHtml = "";
  if (btn) {
    originalHtml = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = `<span class="spinner"></span> <span>Generating PDF…</span>`;
  }

  try {
    const res = await fetch(`${API}/cv/export-pdf`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(reportData)
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.detail || "PDF generation service failed");
    }

    const blob = await res.blob();
    const url = window.URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.style.display = "none";
    a.href = url;
    const prodName = reportData.fused_declarations?.common_name || reportData.image_name || "LMPC_Inspection";
    const cleanName = prodName.replace(/[^a-zA-Z0-9_-]/g, "_");
    a.download = `LMPC_Report_${cleanName}_${new Date().toISOString().slice(0,10)}.pdf`;
    document.body.appendChild(a);
    a.click();
    window.URL.revokeObjectURL(url);
    a.remove();
  } catch (err) {
    alert("Error downloading PDF report: " + err.message);
  } finally {
    if (btn) {
      btn.disabled = false;
      btn.innerHTML = originalHtml;
    }
  }
}

function exportBatchJson() {
  if (!lastBatchResult) return;
  navigator.clipboard.writeText(JSON.stringify(lastBatchResult, null, 2));
  alert("Consolidated inspection report copied to clipboard (JSON).");
}

// ---------------- 2. SINGLE SCAN VIEW ----------------
function renderSingleScanView() {
  document.getElementById("viewContainer").innerHTML = `
    <div class="grid-2">
      <div class="card">
        <div class="card-header">
          <h2>Single Image Direct Inspection</h2>
          <span class="badge PASS">⚡ Fast Scan</span>
        </div>

        <div class="upload-box" id="singleDropZone" onclick="document.getElementById('singleFileInput').click()">
          <div class="upload-icon">📷</div>
          <p><b>Click to select photo</b> or drag & drop</p>
          <input type="file" id="singleFileInput" accept="image/*" style="display:none">
        </div>
        <div id="singleFilePreview" style="font-size:12px; color:var(--text-muted); margin-bottom:12px; display:none;"></div>

        <div class="row2">
          <div>
            <label>Product Category</label>
            <select id="singleCategory">
              <option value="food">Food / Beverage</option>
              <option value="personal_care">Personal Care</option>
              <option value="pharma">Pharmaceutical</option>
              <option value="general">General Commodity</option>
            </select>
          </div>
          <div>
            <label>Inspection Rule</label>
            <select id="singlePreset">
              <option value="retail">Ordinary Retail (Rule 6)</option>
              <option value="wholesale">Wholesale Package (Rule 24)</option>
            </select>
          </div>
        </div>

        <button class="primary" id="singleScanBtn">⚡ Run Single Package Inspection</button>
      </div>

      <div id="singleResultPane">
        <div class="card" style="text-align:center; padding:50px 20px; color:var(--text-muted);">
          <div style="font-size:48px; margin-bottom:12px;">📦</div>
          <h3 style="font-size:16px; font-weight:700; color:var(--text); margin-bottom:6px;">No Package Scanned</h3>
          <p style="font-size:13px; max-width:380px; margin:0 auto;">Upload an image on the left to inspect.</p>
        </div>
      </div>
    </div>
  `;

  const input = document.getElementById("singleFileInput");
  const dropZone = document.getElementById("singleDropZone");
  const note = document.getElementById("singleFilePreview");

  input.onchange = () => {
    if (input.files[0]) {
      note.style.display = "block";
      note.textContent = `Selected: ${input.files[0].name} (${(input.files[0].size/1024).toFixed(1)} KB)`;
    }
  };

  dropZone.ondragover = (e) => { e.preventDefault(); dropZone.classList.add("dragover"); };
  dropZone.ondragleave = () => { dropZone.classList.remove("dragover"); };
  dropZone.ondrop = (e) => {
    e.preventDefault();
    dropZone.classList.remove("dragover");
    if (e.dataTransfer.files.length) {
      input.files = e.dataTransfer.files;
      input.onchange();
    }
  };

  document.getElementById("singleScanBtn").onclick = async () => {
    if (!input.files[0]) { alert("Please choose an image first."); return; }
    const btn = document.getElementById("singleScanBtn");
    btn.disabled = true;
    btn.innerHTML = `<span class="spinner"></span> <span>Analyzing…</span>`;

    const fd = new FormData();
    fd.append("file", input.files[0]);
    fd.append("product_category", document.getElementById("singleCategory").value);
    fd.append("include_overlay_base64", "true");

    try {
      const res = await fetch(`${API}/cv/pipeline`, { method: "POST", body: fd });
      const data = await res.json();
      btn.disabled = false;
      btn.innerHTML = "⚡ Run Single Package Inspection";
      if (!res.ok) {
        document.getElementById("singleResultPane").innerHTML = `<div class="card"><div class="flag-banner">Error: ${data.detail || JSON.stringify(data)}</div></div>`;
        return;
      }
      renderSingleResult(data);
    } catch (err) {
      btn.disabled = false;
      btn.innerHTML = "⚡ Run Single Package Inspection";
      document.getElementById("singleResultPane").innerHTML = `<div class="card"><div class="flag-banner">Network error: ${err.message}</div></div>`;
    }
  };
}

let lastSingleResult = null;
function renderSingleResult(data) {
  lastSingleResult = data;
  const isPass = data.compliance_verdict === "COMPLIANT";
  const isUncertain = data.compliance_verdict === "UNCERTAIN";
  const vBadge = isPass ? "PASS" : (isUncertain ? "UNCERTAIN" : "FAIL");

  const factsRows = (data.compliance_facts || []).map(f => `
    <tr>
      <td><span class="rule-tag">${f.rule}</span></td>
      <td><b>${f.field}</b></td>
      <td>${badge(f.status)}</td>
      <td>${f.value ? `<code>${f.value}</code>` : '<span style="color:#94a3b8;">—</span>'}</td>
      <td style="color:#64748b; font-size:12px;">${f.description}</td>
    </tr>
  `).join("");

  document.getElementById("singleResultPane").innerHTML = `
    <div class="card">
      <div style="background:${isPass ? '#ecfdf5' : '#fef2f2'}; border:1px solid ${isPass ? '#a7f3d0' : '#fecaca'}; border-radius:12px; padding:16px 20px; margin-bottom:16px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
        <div>
          <div style="font-size:16px; font-weight:800; color:${isPass ? '#065f46' : '#991b1b'};">
            ${isPass ? '✓ STATUTORY COMPLIANCE PASSED' : '✕ STATUTORY NON-COMPLIANCE DETECTED'}
          </div>
          <div style="font-size:11px; color:${isPass ? '#047857' : '#b91c1c'}; margin-top:2px;">
            Processing Time: ${data.processing_time_ms} ms
          </div>
        </div>
        <div style="display:flex; gap:8px; align-items:center;">
          <div>${badge(vBadge)}</div>
          <button class="primary" style="margin:0; width:auto; padding:8px 14px; font-size:12px;" onclick="downloadPdfReport(lastSingleResult, this)">
            📥 Download PDF Report
          </button>
        </div>
      </div>

      ${data.overlay_base64 ? `
        <div style="background:#0f172a; border-radius:10px; overflow:hidden; text-align:center; margin-bottom:16px;">
          <img src="${data.overlay_base64}" style="max-height:360px; max-width:100%; display:block; margin:0 auto;" alt="Overlay">
        </div>
      ` : ''}

      <h3 style="font-size:14px; font-weight:700; margin-bottom:10px;">Statutory Findings</h3>
      <table>
        <thead><tr><th>Clause</th><th>Declaration</th><th>Status</th><th>Value</th><th>Provision</th></tr></thead>
        <tbody>${factsRows}</tbody>
      </table>
    </div>
  `;
}

// ---------------- 3. INSPECTION REGISTRY & REVIEW ----------------
async function renderInspections(reviewOnly = false) {
  document.getElementById("viewContainer").innerHTML = `
    <div class="card">
      <div class="card-header">
        <h2>${reviewOnly ? "Supervisor Review Queue (Flagged UNCERTAIN)" : "Historical Inspection Registry"}</h2>
      </div>
      <div style="color:var(--text-muted); font-size:13px;">Loading inspections from database…</div>
    </div>
  `;
  try {
    const url = reviewOnly ? `${API}/inspections?needs_review=true&limit=100` : `${API}/inspections?limit=100`;
    const res = await fetch(url);
    const rows = await res.json();
    if (!rows.length) {
      document.getElementById("viewContainer").innerHTML = `
        <div class="card">
          <div class="card-header"><h2>${reviewOnly ? "Supervisor Review Queue" : "Historical Inspections"}</h2></div>
          <p style="color:var(--text-muted); font-size:13px;">No inspections found yet. Run an AI scan above to generate records.</p>
        </div>`;
      return;
    }

    const trs = rows.map(r => `
      <tr class="clickable" onclick="showHistoryDetail('${r.inspection_id}')">
        <td><code>${r.inspection_id.slice(0, 10)}…</code></td>
        <td><b>${r.product_id || '—'}</b></td>
        <td>${badge(r.overall_status)}</td>
        <td>${r.mrp ? `₹${r.mrp}` : '—'}</td>
        <td style="color:#64748b;">${new Date(r.created_at).toLocaleString()}</td>
        <td>${r.reviewed ? '<span style="color:var(--pass); font-weight:700;">✓ Reviewed</span>' : '<span style="color:#d97706;">Pending</span>'}</td>
      </tr>
    `).join("");

    document.getElementById("viewContainer").innerHTML = `
      <div class="card">
        <div class="card-header">
          <h2>${reviewOnly ? "Supervisor Review Queue" : "Historical Inspections"}</h2>
          <span style="font-size:12px; color:var(--text-muted);">${rows.length} records</span>
        </div>
        <table>
          <thead><tr><th>Inspection ID</th><th>Product</th><th>Status</th><th>MRP</th><th>Timestamp</th><th>Review</th></tr></thead>
          <tbody>${trs}</tbody>
        </table>
      </div>
      <div id="historyDetailPane"></div>
    `;
  } catch (e) {
    document.getElementById("viewContainer").innerHTML = `<div class="card"><div class="flag-banner">Could not fetch records: ${e.message}</div></div>`;
  }
}

async function showHistoryDetail(id) {
  const res = await fetch(`${API}/inspections/${encodeURIComponent(id)}`);
  const d = await res.json();
  const rows = (d.facts || []).map(f => `
    <tr>
      <td><b>${f.field}</b></td>
      <td>${badge(f.status)}</td>
      <td>${f.extracted_value || '—'}</td>
      <td style="color:#64748b;">${f.reason || ''}</td>
    </tr>
  `).join("");

  document.getElementById("historyDetailPane").innerHTML = `
    <div class="card">
      <div class="card-header">
        <h2>Record Details: <code>${d.inspection_id}</code> — ${badge(d.overall_status)}</h2>
        <button class="secondary" onclick="window.open('${API}/inspections/${d.inspection_id}/report.pdf')">📄 Download PDF Report</button>
      </div>
      <table>
        <thead><tr><th>Field</th><th>Status</th><th>Value</th><th>Reason</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  `;
}

renderBatchScanView();
