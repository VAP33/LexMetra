# RULE-01 PRODUCTION-style OpenL RuleServices config (recommended for compose).
#
# No dev deployer. Rules are loaded read-only from mounted deployment zip(s).
# Mount your deployment zip(s) into ${openl.home}/repositories/zipped
# (= /opt/openl/local/repositories/zipped inside the container).

# Keep the embedded REST deployer DISABLED in production.
ruleservice.deployer.enabled = false

# Read deployments from a directory of zip archives (repo-zip).
# repo-zip.uri defaults to ${openl.home}/repositories/zipped
production-repository.$ref = repo-zip
