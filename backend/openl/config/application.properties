# RULE-01 local/dev OpenL RuleServices overrides.
#
# NOTE (DEVOPS-01 handoff): the embedded REST deployer is a DEVELOPMENT-ONLY
# convenience (it lets anyone deploy rules). For production compose, prefer a
# read-only mounted deployment (repo-file/repo-zip volume) and keep the deployer
# DISABLED. See docs/cdd/agents/RULE-01/HANDOFF.md.

# Enable the embedded REST deployer (dev only) so we can PUT rule zips over HTTP.
ruleservice.deployer.enabled = true

# Use a writable local file repository as the production repository so the
# deployer has somewhere to write. Default repo-file.uri = ${openl.home}/repositories/local
# (= /opt/openl/local/repositories/local inside the container).
production-repository.$ref = repo-file
