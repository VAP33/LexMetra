<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="tricolor" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9933"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#138808"/>
    </linearGradient>
  </defs>

  <!-- Logo Icon Container (Left) -->
  <g transform="translate(10, 10)">
    <!-- Hexagonal Shield Background -->
    <path d="M40 0 L72 18 L72 58 L40 78 L8 58 L8 18 Z" fill="url(#shieldGrad)" stroke="#3B82F6" stroke-width="2" stroke-linejoin="round"/>
    
    <!-- Precision Calibration Marks on the Left Border -->
    <line x1="16" y1="28" x2="22" y2="28" stroke="#93C5FD" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="16" y1="36" x2="25" y2="36" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
    <line x1="16" y1="44" x2="22" y2="44" stroke="#93C5FD" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="16" y1="52" x2="25" y2="52" stroke="#10B981" stroke-width="2" stroke-linecap="round"/>

    <!-- Scales of Legal Metrology (Balance Beam & Fulcrum) -->
    <path d="M40 16 L40 62" stroke="#E2E8F0" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M26 26 L54 26" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Left Pan -->
    <path d="M26 26 L22 40 L30 40 Z" fill="none" stroke="#CBD5E1" stroke-width="1.5"/>
    <path d="M20 40 Q26 46 32 40" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
    <!-- Right Pan -->
    <path d="M54 26 L50 40 L58 40 Z" fill="none" stroke="#CBD5E1" stroke-width="1.5"/>
    <path d="M48 40 Q54 46 60 40" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
    <!-- Central Fulcrum / Dial -->
    <circle cx="40" cy="26" r="3.5" fill="#38BDF8" stroke="#0F172A" stroke-width="1"/>

    <!-- Tricolor Ribbon Accent at Base -->
    <rect x="22" y="66" width="36" height="3" rx="1.5" fill="url(#tricolor)"/>
  </g>

  <!-- Brand Typography -->
  <text x="102" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" letter-spacing="4" fill="#0F172A">
    LEX<tspan fill="#2563EB">METRA</tspan>
  </text>
  
  <!-- Pill Badge: DCA AI -->
  <rect x="312" y="24" width="70" height="24" rx="6" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="347" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#1D4ED8" text-anchor="middle" letter-spacing="1">DCA AI</text>

  <!-- Subtitle -->
  <text x="104" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="2.5" fill="#047857">
    LEGAL METROLOGY DIVISION · GOVT OF INDIA
  </text>
</svg>
