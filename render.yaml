services:
  # =============================================================================
  # LexMetra Statutory Legal Metrology Backend Web Service
  # FastAPI, Uvicorn, Tesseract OCR, OpenCV, Pyzbar Barcode Engine
  # =============================================================================
  - type: web
    name: lexmetra-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8000
      - key: ENVIRONMENT
        value: production
      # Database connection to Render managed PostgreSQL (lexmetra-db)
      - key: DATABASE_URL
        fromDatabase:
          name: lexmetra-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://lexmetra-ui.vercel.app,https://rise-sponsor-juvenile.ngrok-free.dev,http://localhost:5173,http://localhost:4173
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: LMPC_DEMO_MODE
        value: "true"
      - key: LMPC_BOOTSTRAP_DEMO_USERS
        value: "true"
      - key: OCR_ENGINE
        value: tesseract
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: SARVAM_API_KEY
        sync: false

# =============================================================================
# Managed PostgreSQL Database for Statutory Register & Inspections
# =============================================================================
databases:
  - name: lexmetra-db
    databaseName: lmpc_db
    user: lmpc_user
    plan: free
    region: oregon
    postgresMajorVersion: "16"
